<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATIQUES Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f0f0f;
}

.login-box{
background:#1a1a1a;
padding:40px;
width:400px;
border-radius:12px;
box-shadow:0 0 20px rgba(255,255,255,.08);
text-align:center;
}

.login-box h1{
color:white;
margin-bottom:25px;
}

.login-box p{
color:#999;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:8px;
font-size:16px;
}

.login-box button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.login-box button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="login-box">

<h1>MEGATIQUES</h1>

<p>Admin Login</p>

<input
type="password"
id="adminPassword"
placeholder="Enter Admin Password"

>

<button type="button" onclick="loginAdmin()">
Login
</button>

</div>

<script>

const savedPassword =
localStorage.getItem("adminPassword")
|| "megatiques123";

function loginAdmin(){

const password =
document.getElementById(
"adminPassword"
).value;

console.log(password);

if(password === savedPassword){

localStorage.setItem(
"adminLoggedIn",
"true"
);

console.log(
localStorage.getItem(
"adminLoggedIn"
)
);

window.location.href =
"admin.html";

}else{

alert("Incorrect Password");

}

}

</script>

</body>
</html>
