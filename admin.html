<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATIQUES Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.admin-header{
background:#111;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.admin-header button{
background:#d4af37;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.dashboard{
padding:30px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
}

.section{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:25px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.section h2{
margin-bottom:20px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

button{
padding:12px 20px;
border:none;
background:black;
color:white;
border-radius:8px;
cursor:pointer;
}

.admin-product{
background:#fafafa;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.admin-product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

#searchProduct{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:20px;

}

/* ORDER MODAL */

.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:999;

}

.modal-content{

background:#fff;
width:90%;
max-width:700px;
margin:40px auto;
padding:30px;
border-radius:15px;
position:relative;
max-height:90vh;
overflow-y:auto;

}

.close{

position:absolute;
right:20px;
top:15px;
font-size:30px;
cursor:pointer;
font-weight:bold;

}

.order-item{

display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee;

}

.order-info{

margin-bottom:20px;

}

.order-info h3{

margin-bottom:8px;

}

.order-total{

font-size:22px;
font-weight:bold;
color:#d4af37;
margin-top:20px;

}

.badge{

display:inline-block;

padding:4px 10px;

border-radius:20px;

background:#111;

color:#fff;

font-size:12px;

font-weight:600;

}

.admin-category{

display:flex;
gap:20px;
margin-bottom:20px;
align-items:center;

}

.admin-category img{

width:180px;
height:100px;
object-fit:cover;
border-radius:8px;

}

</style>

</head>

<body>

<script>

if(
localStorage.getItem(
"adminLoggedIn"
)!=="true"
){
window.location.href=
"admin-login.html";
}

function logoutAdmin(){

localStorage.removeItem(
"adminLoggedIn"
);

window.location.href=
"admin-login.html";

}

function changePassword(){

const newPassword =
prompt(
"Enter New Password"
);

if(!newPassword) return;

localStorage.setItem(
"adminPassword",
newPassword
);

alert(
"Password Updated Successfully"
);

}

</script>

<div class="admin-header">

<h1>MEGATIQUES ADMIN</h1>

<div>

<button onclick="changePassword()">
Change Password
</button>

<button onclick="logoutAdmin()">
Logout
</button>

</div>

</div>

<div class="dashboard">

<div class="stats">

<div class="card">
<h3>Total Products</h3>
<p id="total-products">0</p>
</div>

<div class="card">
<h3>Total Orders</h3>
<p id="total-orders">0</p>
</div>

<div class="card">
<h3>Pending Orders</h3>
<p id="pending-orders">0</p>
</div>

<div class="card">
<h3>Total Revenue</h3>
<p id="total-revenue">₦0</p>
</div>

<div class="card">

<h3>Customers</h3>

<p id="total-customers">0</p>

</div>

</div><!-- ===================== -->
<!-- COLLECTIONS -->
<!-- ===================== -->

<div class="section">

    <h2>Collections</h2>

    <input
        type="text"
        id="categoryName"
        placeholder="Collection Name">

    <input
        type="text"
        id="categorySlug"
        placeholder="Slug (example: luxury-bags)">

    <textarea
        id="categoryDescription"
        placeholder="Collection Description">
    </textarea>

    <input
        type="file"
        id="categoryBanner"
        accept="image/*">

    <button onclick="saveCategory()">
        Save Collection
    </button>

    <hr style="margin:25px 0;">

    <h2>Existing Collections</h2>

    <div id="categories-list"></div>

</div>


<!-- ===================== -->
<!-- ADD PRODUCT -->
<!-- ===================== -->

<div class="section">

    <h2>Add Product</h2>

    <input
        type="text"
        id="productName"
        placeholder="Product Name">

    <input
        type="number"
        id="productPrice"
        placeholder="Price">

    <textarea
        id="productDescription"
        placeholder="Description">
    </textarea>

    <input
        type="file"
        id="productImage"
        accept="image/*">

    <label>Extra Images</label>

    <input
        type="file"
        id="productGallery"
        multiple
        accept="image/*">

    <select id="productCategory">

        <option value="">
            Select Collection
        </option>

        <!-- Categories will be loaded automatically -->

    </select>

    <input
        type="number"
        id="productStock"
        placeholder="Stock">

    <hr>

    <label>
        <input
            type="checkbox"
            id="featured">
        Featured Product
    </label>

    <br>

    <label>
        <input
            type="checkbox"
            id="newArrival"
            checked>
        New Arrival
    </label>

    <br>

    <label>
        <input
            type="checkbox"
            id="trending">
        Trending Product
    </label>

    <br>

    <label>
        <input
            type="checkbox"
            id="bestSeller">
        Best Seller
    </label>

    <br><br>

    <button onclick="addProduct()">
        Add Product
    </button>

</div>


<!-- ===================== -->
<!-- PRODUCTS -->
<!-- ===================== -->

<div class="section">

    <h2>Products</h2>

    <input
        type="text"
        id="searchProduct"
        placeholder="Search Products..."
        onkeyup="searchProducts()">

    <br><br>

    <div class="dashboard-stats">

        <div class="stat-card">
            <h3>Total Products</h3>
            <h2 id="totalProducts">0</h2>
        </div>

        <div class="stat-card">
            <h3>Total Stock</h3>
            <h2 id="totalStock">0</h2>
        </div>

        <div class="stat-card">
            <h3>Featured</h3>
            <h2 id="featuredCount">0</h2>
        </div>

        <div class="stat-card">
            <h3>Collections</h3>
            <h2 id="categoryCount">0</h2>
        </div>

    </div>

    <div id="products-list"></div>

</div>


<!-- ===================== -->
<!-- ORDERS -->
<!-- ===================== -->

<div class="section">

    <h2>Orders</h2>

    <div id="orders-list"></div>

</div>

<!-- ORDER DETAILS MODAL -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <span class="close"
        onclick="closeOrderModal()">
        &times;
        </span>

        <h2>Order Details</h2>

        <div id="orderDetails"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
